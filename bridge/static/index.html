<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ATEM PTZ Bridge</title>
<style>
  /* Symphonityブランドトーン: 白背景 + 温グレーカード + ネイビー + コバルトブルー */
  :root {
    --bg: #ffffff; --panel: #f0efec; --panel2: #ffffff; --line: #dddad4;
    --inner-line: #eceae5; --text: #1c2438; --dim: #6d7280; --faint: #b3b5bc;
    --navy: #0e1a3c; --accent: #1d2fe0; --accent-soft: #e8ebff;
    --pgm: #e03c2a; --pvw: #2f9e44; --rec: #e03c2a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Avenir Next", "Helvetica Neue", -apple-system, "Hiragino Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none; display: flex; flex-direction: column; overflow: hidden;
  }

  /* ---- タイトルバー ---- */
  header {
    display: flex; align-items: center; gap: 12px; flex: none;
    height: 64px; padding: 0 30px;
    background: var(--bg);
  }
  header .logo { height: 24px; width: auto; display: block; }
  header .sep { width: 1px; height: 22px; background: var(--inner-line); }
  header h1 { font-size: 19px; font-weight: 500; letter-spacing: .01em; color: var(--navy); }
  header h1 b { font-weight: 700; }
  .badges { margin-left: auto; display: flex; gap: 8px; }
  .badge {
    font-size: 12px; font-weight: 600; padding: 7px 15px; border-radius: 999px;
    background: var(--panel); color: var(--dim); border: none;
  }
  .badge.on { color: var(--accent); background: var(--accent-soft); }

  /* ---- カメラタブ（ピル型ナビ） ---- */
  #camTabs {
    flex: none; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px;
    background: var(--panel); border-radius: 26px; padding: 6px;
    margin: 6px auto 0; max-width: 94%; width: fit-content;
  }
  #camTabs button {
    background: none; border: none; color: #4a5165; cursor: pointer;
    font-size: 14px; padding: 10px 14px; border-radius: 999px;
    white-space: nowrap; font-weight: 600;
  }
  #camTabs button.active { color: #fff; background: var(--navy); }
  #camTabs button .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 7px; background: #d3d1cb; vertical-align: 1px;
  }
  #camTabs button.pgm .dot { background: var(--pgm); box-shadow: 0 0 5px var(--pgm); }
  #camTabs button.pvw .dot { background: var(--pvw); }

  /* ---- メイン ---- */
  main { flex: 1; overflow-y: auto; min-height: 0; padding: 34px 0 48px; }
  #wrap {
    width: 80%; max-width: 1680px; margin: 0 auto;
    display: grid; grid-template-columns: minmax(430px, 1.05fr) 1fr;
    gap: 28px; align-items: start;
  }
  .panel {
    background: var(--panel); display: flex; flex-direction: column; min-width: 0;
    border: none; border-radius: 24px; overflow: hidden;
  }
  @media (max-width: 1100px) {
    #wrap { width: 94%; grid-template-columns: 1fr; }
  }

  /* ---- オンエアバナー ---- */
  #onairBanner {
    flex: none; display: flex; align-items: center; height: 60px; padding: 0 26px;
    background: transparent;
  }
  #onairBanner .cam { font-size: 21px; font-weight: 700; color: var(--navy); }
  #onairBanner .state { margin-left: 14px; font-size: 15px; font-weight: 600; color: var(--dim); }
  #onairBanner.pgm { background: var(--pgm); }
  #onairBanner.pvw { background: var(--pvw); }
  #onairBanner.pgm .cam, #onairBanner.pgm .state,
  #onairBanner.pvw .cam, #onairBanner.pvw .state { color: #fff; }
  #angles { margin-left: auto; font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }
  #onairBanner.pgm #angles, #onairBanner.pvw #angles { color: #ffffffcc; }

  /* ---- 数値リードアウト ---- */
  #readout {
    flex: none; display: grid; grid-template-columns: repeat(4, 1fr);
    background: var(--panel2); border-radius: 16px; margin: 0 22px;
  }
  #readout .cell { padding: 12px 8px 13px; text-align: center; border-right: 1px solid var(--inner-line); }
  #readout .cell:last-child { border-right: none; }
  #readout .k { font-size: 11px; color: var(--dim); letter-spacing: .06em; }
  #readout .v { font-size: 18px; font-weight: 600; color: var(--navy); margin-top: 3px; font-variant-numeric: tabular-nums; }

  /* ---- ジョイスティック ---- */
  #stickWrap { display: flex; flex-direction: column; padding: 22px; }
  #padRow { flex: none; display: flex; gap: 18px; height: clamp(380px, 48vh, 540px); }
  .vcol {
    flex: none; width: 64px; display: flex; flex-direction: column;
    align-items: center; gap: 6px;
  }
  .vcap { font-size: 13px; color: var(--dim); }
  .vname { font-size: 11px; color: var(--dim); letter-spacing: .08em; margin-top: 3px; }
  .vval { font-size: 13px; font-weight: 600; color: var(--navy); font-variant-numeric: tabular-nums; }
  .vtrack {
    position: relative; flex: 1; width: 44px; border-radius: 999px;
    background: var(--panel2); border: 1px solid var(--line);
    touch-action: none; cursor: grab;
  }
  .vticks {
    position: absolute; left: 10px; right: 10px; top: 14px; bottom: 14px;
    background: repeating-linear-gradient(to bottom, #e7e5e0 0 1px, transparent 1px 10px);
    pointer-events: none;
  }
  .vthumb {
    position: absolute; width: 34px; height: 34px; left: 50%; margin-left: -17px;
    top: 50%; border-radius: 50%;
    background: var(--navy); border: none;
    box-shadow: 0 2px 8px rgba(14, 26, 60, .35);
    pointer-events: none;
  }
  .vtrack .centerline {
    position: absolute; left: 8px; right: 8px; top: 50%; height: 1px;
    background: #d8d6d0; pointer-events: none;
  }
  #stickArea {
    position: relative; flex: 1; min-height: 0; border-radius: 20px;
    background: var(--panel2); border: 1px solid var(--line);
    touch-action: none; cursor: grab;
  }
  #stickArea .cross-v, #stickArea .cross-h { position: absolute; background: #eceae5; }
  #stickArea .cross-v { left: 50%; top: 5%; bottom: 5%; width: 1px; }
  #stickArea .cross-h { top: 50%; left: 3%; right: 3%; height: 1px; }
  #stickArea .ring {
    position: absolute; left: 50%; top: 50%; width: 56%; aspect-ratio: 1;
    transform: translate(-50%, -50%); border-radius: 50%;
    border: 1px dashed #dedcd6;
  }
  /* ATEM SC風の立体ノブ（外リム+内円+方向矢印）。中央ドットはブランドブルー */
  #knob {
    position: absolute; width: 66px; height: 66px; border-radius: 50%;
    left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 2;
    background: radial-gradient(circle at 50% 32%, #47484b, #232426 78%);
    border: 1px solid #17181a;
    box-shadow: 0 6px 16px rgba(0, 0, 0, .45), inset 0 1px 0 #ffffff20;
    pointer-events: none;
  }
  #knob::before {
    content: ""; position: absolute; inset: 7px; border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, #2c2d2f, #1e1f21 80%);
    box-shadow: inset 0 2px 5px #000a;
  }
  #knob::after {
    content: ""; position: absolute; inset: 0; margin: auto;
    width: 22px; height: 22px; border-radius: 50%; z-index: 2;
    background: var(--accent); border: none;
  }
  #knob .arr { position: absolute; width: 0; height: 0; z-index: 1; }
  #knob .arr.up {
    left: 50%; top: 10px; transform: translateX(-50%);
    border-left: 4px solid transparent; border-right: 4px solid transparent;
    border-bottom: 5px solid #6a6c70;
  }
  #knob .arr.down {
    left: 50%; bottom: 10px; transform: translateX(-50%);
    border-left: 4px solid transparent; border-right: 4px solid transparent;
    border-top: 5px solid #6a6c70;
  }
  #knob .arr.left {
    top: 50%; left: 10px; transform: translateY(-50%);
    border-top: 4px solid transparent; border-bottom: 4px solid transparent;
    border-right: 5px solid #6a6c70;
  }
  #knob .arr.right {
    top: 50%; right: 10px; transform: translateY(-50%);
    border-top: 4px solid transparent; border-bottom: 4px solid transparent;
    border-left: 5px solid #6a6c70;
  }
  .stickFoot { flex: none; padding-top: 16px; }
  .hint { font-size: 12px; color: var(--dim); margin-top: 10px; line-height: 1.7; }

  /* ---- 右パネル ---- */
  #rightPanel { padding: 24px; gap: 22px; }
  section h2 {
    font-size: 13px; font-weight: 700; color: var(--navy);
    letter-spacing: .04em; margin-bottom: 10px;
  }
  .box {
    background: var(--panel2); border: none; border-radius: 16px;
    padding: 20px;
  }

  /* ---- 共通コントロール ---- */
  .row { display: flex; gap: 12px; align-items: center; margin-top: 16px; }
  .row:first-of-type { margin-top: 0; }
  .row label { font-size: 14px; color: var(--dim); min-width: 76px; }
  .val {
    min-width: 62px; text-align: right; font-size: 14px; font-weight: 600; color: var(--navy);
    font-variant-numeric: tabular-nums;
    border-bottom: 2px solid var(--accent); padding-bottom: 2px;
  }
  input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; height: 20px; background: transparent; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; background: #e6e4df; border-radius: 2px; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent); border: 3px solid #fff;
    margin-top: -8px; box-shadow: 0 1px 4px rgba(0, 0, 0, .25);
  }
  input[type=range]::-moz-range-track { height: 4px; background: #e6e4df; border-radius: 2px; }
  input[type=range]::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); border: 3px solid #fff;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .25);
  }
  select {
    flex: 1; background: var(--panel); color: var(--navy);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
    font-size: 14px; font-weight: 600; font-family: inherit;
  }
  button {
    background: var(--panel); color: var(--navy);
    border: none; border-radius: 999px;
    padding: 12px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
    font-family: inherit;
  }
  button:hover { background: #e7e5e0; }
  button:active { background: var(--accent); color: #fff; }

  .presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .presets button { padding: 20px 0; font-size: 17px; font-weight: 700; color: var(--dim); border-radius: 16px; }
  .presets button.saved { color: var(--accent); background: var(--accent-soft); }

  button.rec { font-weight: 700; letter-spacing: .05em; background: var(--navy); color: #fff; }
  button.rec:hover { background: #1a2752; }
  button.rec.on {
    background: var(--rec); color: #fff;
    box-shadow: 0 0 0 4px rgba(224, 60, 42, .18);
  }

  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--navy); color: #fff; border: none;
    padding: 11px 24px; border-radius: 999px; font-size: 13px; font-weight: 600;
    box-shadow: 0 8px 24px rgba(14, 26, 60, .3);
    opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 10;
  }
</style>
</head>
<body>
<header>
  <img class="logo" src="/static/symphonity.webp" alt="Symphonity">
  <span class="sep"></span>
  <h1><b>ATEM</b> PTZ Bridge</h1>
  <div class="badges">
    <span class="badge" id="wsBadge">サーバー</span>
    <span class="badge" id="atemBadge">ATEM</span>
    <span class="badge" id="padBadge">パッド</span>
  </div>
</header>

<nav id="camTabs"></nav>

<main>
<div id="wrap">
  <div class="panel">
    <div id="onairBanner">
      <span class="cam" id="onairCam">Cam 1</span>
      <span class="state" id="onairState">スタンバイ</span>
      <span id="angles"></span>
    </div>
    <div id="readout">
      <div class="cell"><div class="k">アイリス</div><div class="v" id="roIris">f/4.7</div></div>
      <div class="cell"><div class="k">ISO</div><div class="v" id="roIso">800</div></div>
      <div class="cell"><div class="k">シャッター</div><div class="v" id="roShutter">1/50</div></div>
      <div class="cell"><div class="k">バランス</div><div class="v" id="roWb">5600K</div></div>
    </div>
    <div id="stickWrap">
      <div id="padRow">
        <div class="vcol">
          <span class="vcap">開放</span>
          <div class="vtrack" id="irisTrack">
            <div class="vticks"></div>
            <div class="vthumb" id="irisThumb"></div>
          </div>
          <span class="vcap">絞る</span>
          <span class="vname">アイリス</span>
          <span class="vval" id="irisVal">f/4.7</span>
        </div>
        <div id="stickArea">
          <div class="cross-v"></div><div class="cross-h"></div><div class="ring"></div>
          <div id="knob">
            <i class="arr up"></i><i class="arr down"></i><i class="arr left"></i><i class="arr right"></i>
          </div>
        </div>
        <div class="vcol">
          <span class="vcap">T</span>
          <div class="vtrack" id="zoomTrack">
            <div class="centerline"></div>
            <div class="vthumb" id="zoomThumb"></div>
          </div>
          <span class="vcap">W</span>
          <span class="vname">ズーム</span>
          <span class="vval" id="zoomVal">&nbsp;</span>
        </div>
      </div>
      <div class="stickFoot">
        <div class="row">
          <label>最大速度</label>
          <input type="range" id="speedScale" min="10" max="100" value="60">
          <span class="val" id="speedVal">60%</span>
        </div>
        <div class="row">
          <button id="recenterBtn">⌂ センターへ</button>
        </div>
        <div class="hint">ズームロッカーはPZレンズのみ有効（押している間ズーム）<br>
        ゲームパッド: 左スティック=パン/チルト、右スティック上下=ズーム、R1押しながらで高速<br>
        キーボード: 数字キー1〜9でカメラ切り替え</div>
      </div>
    </div>
  </div>

  <div class="panel" id="rightPanel">
    <section>
      <h2>プリセット — タップ=呼び出し / 長押し=保存</h2>
      <div class="box">
        <div class="row" style="margin-top:0">
          <label>移動時間</label>
          <input type="range" id="presetMs" min="3" max="50" step="1" value="15">
          <span class="val" id="presetMsVal">1.5s</span>
        </div>
        <div class="presets" id="presets" style="margin-top:16px"></div>
      </div>
    </section>

    <section>
      <h2 id="camTitle">FX3 — カメラ1</h2>
      <div class="box">
        <div class="row" style="margin-top:0"><label>ISO</label>
          <select id="iso"></select></div>
        <div class="row"><label>シャッター</label>
          <select id="shutter"></select></div>
        <div class="row"><label>WB</label>
          <input type="range" id="wb" min="2500" max="7500" step="100" value="5600">
          <span class="val" id="wbVal">5600K</span></div>
      </div>
    </section>

    <section>
      <h2>収録</h2>
      <div class="box">
        <div class="row" style="margin-top:0">
          <button class="rec" id="recBtn" style="flex:1">● REC</button>
          <button id="recAllBtn">全カメラREC</button>
        </div>
      </div>
    </section>
  </div>
</div>
</main>
<div id="toast"></div>

<script>
let CAM = 1;                 // 操作対象カメラ（タブで切り替え）
const MAX_CAMS = 20;         // タブは常時20カメラ分表示（未設定カメラへの操作はブリッジ側で無視）
let camIds = Array.from({ length: MAX_CAMS }, (_, i) => i + 1);
let lastTally = {};
let ws = null, recOn = false, savedPresets = [];

// ---------- タブ / オンエアバナー ----------
let tabsSig = "";
function renderTabs() {
  const sig = JSON.stringify([camIds, CAM, camIds.map(id => lastTally[id] || "off")]);
  if (sig === tabsSig) return;   // 変化がなければDOM再生成しない
  tabsSig = sig;
  const nav = document.getElementById("camTabs");
  nav.innerHTML = "";
  camIds.forEach(id => {
    const b = document.createElement("button");
    const t = lastTally[id] || "off";
    b.className = (id === CAM ? "active " : "") + (t !== "off" ? t : "");
    b.innerHTML = `<span class="dot"></span>Cam${id}`;
    b.onclick = () => selectCam(id);
    nav.appendChild(b);
  });
  document.getElementById("camTitle").textContent = `FX3 — カメラ${CAM}`;
  renderBanner();
}

function renderBanner() {
  const t = lastTally[CAM] || "off";
  const el = document.getElementById("onairBanner");
  el.className = t !== "off" ? t : "";
  document.getElementById("onairCam").textContent = `Cam${CAM}`;
  document.getElementById("onairState").textContent =
    t === "pgm" ? "オンエア" : t === "pvw" ? "プレビュー" : "スタンバイ";
}

function selectCam(id) {
  if (id === CAM) return;
  // 切り替え前に現カメラのジンバルを停止
  send({ t: "joy", cam: CAM, yaw: 0, pitch: 0 });
  CAM = id;
  savedPresets = [];
  renderTabs();
  renderPresets();
}

// ---------- WebSocket ----------
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => setBadge("wsBadge", "サーバー接続", true);
  ws.onclose = () => { setBadge("wsBadge", "サーバー切断", false); setTimeout(connect, 1500); };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.t === "state") applyState(m);
    if (m.t === "tally") { lastTally = m.tally; renderTabs(); renderBanner(); }
    if (m.t === "ccu") applyCcu(m);
    if (m.t === "toast") toast(m.msg);
  };
}
function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }
function setBadge(id, text, on) {
  const el = document.getElementById(id);
  el.textContent = text; el.classList.toggle("on", !!on);
}
function applyState(m) {
  setBadge("atemBadge", m.atem_connected ? "ATEM接続" : "ATEM未接続", m.atem_connected);
  // タブは常時1〜20を表示する（設定済みカメラだけに絞らない）
  if (!camIds.includes(CAM)) CAM = camIds[0];
  lastTally = m.tally || {};
  renderTabs();
  renderBanner();
  const g = (m.gimbals || {})[CAM];
  if (g) {
    savedPresets = g.presets || [];
    renderPresets();
    if (g.angles) {
      document.getElementById("angles").textContent =
        `PAN ${(g.angles.y/10).toFixed(1)}°  TILT ${(g.angles.p/10).toFixed(1)}°`;
    }
  }
  const cam = (m.cameras || {})[CAM];
  if (cam && cam.rec !== recOn) { recOn = cam.rec; renderRec(); }
}
// ATEM Software Control側での操作をパネルUIへ反映
function applyCcu(m) {
  if (m.cam !== CAM) return;
  if (m.param === "iris_norm") {
    irisSlider.set(m.value);
    irisValEl.textContent = normToF(m.value);
  } else if (m.param === "wb_kelvin") {
    wb.value = m.value;
    document.getElementById("wbVal").textContent = m.value + "K";
  } else if (m.param === "iso") {
    if ([...isoSel.options].some(o => +o.value === m.value)) isoSel.value = m.value;
  } else if (m.param === "shutter") {
    if ([...shSel.options].some(o => +o.value === m.value)) shSel.value = m.value;
  } else {
    return;   // zoom_speed / focus_norm は表示対象外
  }
  updateReadout();
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.style.opacity = 1;
  setTimeout(() => el.style.opacity = 0, 1800);
}

// ---------- ジョイスティック（画面） ----------
const area = document.getElementById("stickArea");
const knob = document.getElementById("knob");
let dragging = false;
let joy = { x: 0, y: 0 };

function setKnob(x, y) {  // x,y: -1..1
  knob.style.left = `${50 + x * 42}%`;
  knob.style.top = `${50 + y * 42}%`;
}
function pointerJoy(e) {
  const r = area.getBoundingClientRect();
  let x = ((e.clientX - r.left) / r.width - 0.5) * 2.4;
  let y = ((e.clientY - r.top) / r.height - 0.5) * 2.4;
  const len = Math.hypot(x, y);
  if (len > 1) { x /= len; y /= len; }
  joy = { x, y };
  setKnob(x, y);
}
area.addEventListener("pointerdown", e => { dragging = true; area.setPointerCapture(e.pointerId); pointerJoy(e); });
area.addEventListener("pointermove", e => dragging && pointerJoy(e));
["pointerup", "pointercancel"].forEach(ev =>
  area.addEventListener(ev, () => { dragging = false; joy = { x: 0, y: 0 }; setKnob(0, 0); }));

// ---------- ゲームパッド ----------
let padIndex = null;
window.addEventListener("gamepadconnected", e => {
  padIndex = e.gamepad.index;
  setBadge("padBadge", `🎮 接続`, true);
});
window.addEventListener("gamepaddisconnected", () => { padIndex = null; setBadge("padBadge", "パッド", false); });

function readPad() {
  if (padIndex === null) return null;
  const gp = navigator.getGamepads()[padIndex];
  if (!gp) return null;
  const dz = v => Math.abs(v) < 0.08 ? 0 : v;   // デッドゾーン
  const boost = gp.buttons[5] && gp.buttons[5].pressed ? 1.0 : 0.5; // R1=高速
  return {
    x: dz(gp.axes[0]) * boost,
    y: dz(gp.axes[1]) * boost,
    zoom: -dz(gp.axes[3] || 0),   // 右スティック縦: 上=T(寄り) / 下=W(引き)
  };
}

// ---------- 送信ループ (30Hz) ----------
let lastSent = { x: 0, y: 0 };
let lastZoom = 0;
setInterval(() => {
  const pad = readPad();
  const src = (pad && (pad.x || pad.y)) ? pad : joy;
  const scale = document.getElementById("speedScale").value / 100;
  const out = { x: src.x * scale, y: src.y * scale };
  if (out.x || out.y || lastSent.x || lastSent.y) {
    // チルトは上方向を＋にするためYを反転
    send({ t: "joy", cam: CAM, yaw: out.x, pitch: -out.y });
    if (pad && (pad.x || pad.y)) setKnob(pad.x, pad.y);
    lastSent = out;
  }
  // 右スティック → FX3ズーム速度（パッド接続中のみ・値が変わったときだけ送信）
  if (pad) {
    const z = Math.round(pad.zoom * 10) / 10;
    if (z !== lastZoom) {
      send({ t: "cam_set", cam: CAM, param: "zoom_speed", value: z });
      lastZoom = z;
    }
  }
}, 33);

document.getElementById("speedScale").oninput = e =>
  document.getElementById("speedVal").textContent = e.target.value + "%";

// ---------- プリセット/センター移動時間 ----------
const presetMsEl = document.getElementById("presetMs");
const presetMsValEl = document.getElementById("presetMsVal");
try {
  const s = localStorage.getItem("presetMs");
  if (s) presetMsEl.value = s;
} catch (_) {}
function fmtPresetMs() { presetMsValEl.textContent = (presetMsEl.value / 10).toFixed(1) + "s"; }
function presetMoveMs() { return Math.round(presetMsEl.value * 100); }  // スライダー3..50 → 300..5000ms
fmtPresetMs();
presetMsEl.oninput = () => {
  fmtPresetMs();
  try { localStorage.setItem("presetMs", presetMsEl.value); } catch (_) {}
};

document.getElementById("recenterBtn").onclick =
  () => send({ t: "recenter", cam: CAM, ms: presetMoveMs() });

// ---------- プリセット ----------
function renderPresets() {
  const box = document.getElementById("presets");
  if (box.childElementCount === 0) {
    for (let i = 1; i <= 6; i++) {
      const b = document.createElement("button");
      b.textContent = i;
      let timer = null, longPressed = false;
      b.addEventListener("pointerdown", () => {
        longPressed = false;
        timer = setTimeout(() => { longPressed = true; send({ t: "preset_save", cam: CAM, slot: i }); }, 700);
      });
      b.addEventListener("pointerup", () => {
        clearTimeout(timer);
        if (!longPressed) send({ t: "preset_recall", cam: CAM, slot: i, ms: presetMoveMs() });
      });
      b.addEventListener("pointerleave", () => clearTimeout(timer));
      box.appendChild(b);
    }
  }
  [...box.children].forEach((b, i) =>
    b.classList.toggle("saved", savedPresets.includes(String(i + 1))));
}
renderPresets();

// ---------- カメラ ----------
const ISO_LIST = [800, 1000, 1250, 1600, 2000, 2500, 3200, 4000, 5000, 6400, 8000, 10000, 12800];
const SHUTTER_LIST = [50, 60, 100, 125, 250, 500, 1000];
const isoSel = document.getElementById("iso");
ISO_LIST.forEach(v => isoSel.add(new Option("ISO " + v, v)));
isoSel.value = 800;
const shSel = document.getElementById("shutter");
SHUTTER_LIST.forEach(v => shSel.add(new Option("1/" + v, v)));
shSel.value = 50;

function updateReadout() {
  document.getElementById("roIris").textContent = document.getElementById("irisVal").textContent;
  document.getElementById("roIso").textContent = isoSel.value;
  document.getElementById("roShutter").textContent = "1/" + shSel.value;
  document.getElementById("roWb").textContent = wb.value + "K";
}

isoSel.onchange = () => { send({ t: "cam_set", cam: CAM, param: "iso", value: +isoSel.value }); updateReadout(); };
shSel.onchange = () => { send({ t: "cam_set", cam: CAM, param: "shutter", value: +shSel.value }); updateReadout(); };

function normToF(n) {  // 表示用の目安 (f/1.4〜f/16)
  return "f/" + (1.4 * Math.pow(2, n * 3.5)).toFixed(1);
}

// ---------- 縦スライダー共通 (0=上端, 1=下端) ----------
function vSlider(trackId, thumbId, { spring = false, onInput }) {
  const track = document.getElementById(trackId);
  const thumb = document.getElementById(thumbId);
  let pos = 0.5, active = false;
  thumb.style.transform = "none";
  function render() {
    const range = track.clientHeight - thumb.offsetHeight - 6;
    thumb.style.top = (pos * range + 3) + "px";
  }
  function fromEvent(e) {
    const r = track.getBoundingClientRect();
    const range = r.height - thumb.offsetHeight - 6;
    pos = Math.min(1, Math.max(0, (e.clientY - r.top - thumb.offsetHeight / 2 - 3) / range));
    render();
    onInput(pos);
  }
  track.addEventListener("pointerdown", e => { active = true; track.setPointerCapture(e.pointerId); fromEvent(e); });
  track.addEventListener("pointermove", e => active && fromEvent(e));
  ["pointerup", "pointercancel"].forEach(ev => track.addEventListener(ev, () => {
    active = false;
    if (spring) { pos = 0.5; render(); onInput(0.5); }
  }));
  render();
  window.addEventListener("resize", render);
  return { set(p) { pos = Math.min(1, Math.max(0, p)); render(); } };
}

// ---------- アイリス（縦・上=開放） ----------
const irisValEl = document.getElementById("irisVal");
const irisSlider = vSlider("irisTrack", "irisThumb", {
  onInput: p => {
    irisValEl.textContent = normToF(p);
    send({ t: "cam_set", cam: CAM, param: "iris_norm", value: p });
    updateReadout();
  }
});

// ---------- ズームロッカー（縦・上=T/下=W、離すと中央へ） ----------
const zoomValEl = document.getElementById("zoomVal");
let rockerZoom = 0;
vSlider("zoomTrack", "zoomThumb", {
  spring: true,
  onInput: p => {
    const v = Math.round((0.5 - p) * 2 * 10) / 10;   // +1=T(寄り) / -1=W(引き)
    if (v !== rockerZoom) {
      rockerZoom = v;
      lastZoom = v;   // ゲームパッドループが即0で上書きしないよう同期
      send({ t: "cam_set", cam: CAM, param: "zoom_speed", value: v });
    }
    zoomValEl.innerHTML = v ? (v > 0 ? "T" : "W") + Math.abs(Math.round(v * 100)) + "%" : "&nbsp;";
  }
});

const wb = document.getElementById("wb");
wb.oninput = () => {
  document.getElementById("wbVal").textContent = wb.value + "K";
  send({ t: "cam_set", cam: CAM, param: "wb_kelvin", value: +wb.value });
  updateReadout();
};

const recBtn = document.getElementById("recBtn");
function renderRec() {
  recBtn.classList.toggle("on", recOn);
  recBtn.textContent = recOn ? "■ REC停止" : "● REC";
}
recBtn.onclick = () => { recOn = !recOn; renderRec(); send({ t: "rec", cam: CAM, on: recOn }); };

let allRecOn = false;
document.getElementById("recAllBtn").onclick = () => {
  allRecOn = !allRecOn;
  send({ t: "rec_all", on: allRecOn });
  toast(allRecOn ? "全カメラ REC開始" : "全カメラ REC停止");
};

// 数字キー1〜9でカメラ切り替え、10台目以降はタブクリックで
// （select等にフォーカス中は無効）
document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 9 && camIds.includes(n)) selectCam(n);
});

renderTabs();
renderBanner();
updateReadout();
connect();
</script>
