<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ATEM PTZ Bridge</title>
<style>
  :root {
    --bg: #14161a; --panel: #1e2128; --line: #2e323b;
    --text: #e6e8ec; --dim: #8a8f99;
    --accent: #4a9eff; --pgm: #e53935; --pvw: #43a047; --rec: #e53935;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Hiragino Sans", sans-serif;
    min-height: 100vh; user-select: none;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 15px; font-weight: 600; }
  .badge {
    font-size: 11px; padding: 3px 8px; border-radius: 10px;
    background: var(--panel); color: var(--dim); border: 1px solid var(--line);
  }
  .badge.on { color: #7ee787; border-color: #2ea04366; }
  #tallyBadge.pgm { background: var(--pgm); color: #fff; border-color: var(--pgm); }
  #tallyBadge.pvw { background: var(--pvw); color: #fff; border-color: var(--pvw); }
  #camTabs {
    display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 14px 0;
    max-width: 1100px; margin: 0 auto;
  }
  #camTabs button {
    padding: 10px 16px; font-size: 14px; font-weight: 600;
    border-radius: 8px; border: 2px solid var(--line); position: relative;
  }
  #camTabs button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  #camTabs button.pgm { border-color: var(--pgm); }
  #camTabs button.pvw { border-color: var(--pvw); }
  #camTabs button .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 6px; background: var(--line); vertical-align: 1px;
  }
  #camTabs button.pgm .dot { background: var(--pgm); }
  #camTabs button.pvw .dot { background: var(--pvw); }
  main {
    display: grid; grid-template-columns: 1fr 340px; gap: 14px;
    padding: 14px; max-width: 1100px; margin: 0 auto;
  }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px;
  }
  .card h2 { font-size: 12px; color: var(--dim); font-weight: 600; margin-bottom: 10px; letter-spacing: .05em; }

  /* ジョイスティック */
  #stickArea {
    position: relative; width: 100%; aspect-ratio: 1; max-width: 420px;
    margin: 0 auto; border-radius: 50%;
    background: radial-gradient(circle, #23272f 0%, #1a1d23 70%);
    border: 1px solid var(--line); touch-action: none; cursor: grab;
  }
  #stickArea::before, #stickArea::after {
    content: ""; position: absolute; background: var(--line);
  }
  #stickArea::before { left: 50%; top: 6%; bottom: 6%; width: 1px; }
  #stickArea::after { top: 50%; left: 6%; right: 6%; height: 1px; }
  #knob {
    position: absolute; width: 64px; height: 64px; border-radius: 50%;
    background: var(--accent); left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 4px 14px #0008; pointer-events: none; z-index: 2;
  }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  .row label { font-size: 12px; color: var(--dim); min-width: 4.5em; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  button {
    background: #2a2e37; color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 14px; font-size: 13px; cursor: pointer;
  }
  button:active { background: var(--accent); }
  button.rec { font-weight: 700; }
  button.rec.on { background: var(--rec); border-color: var(--rec); color: #fff; }
  .presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 4px; }
  .presets button { padding: 14px 0; font-size: 14px; }
  .presets button.saved { border-color: var(--accent); color: var(--accent); }
  .hint { font-size: 11px; color: var(--dim); margin-top: 8px; }
  select {
    background: #2a2e37; color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px; font-size: 13px; flex: 1;
  }
  .kv { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #fff; padding: 10px 20px;
    border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .25s;
    pointer-events: none; z-index: 10;
  }
</style>
</head>
<body>
<header>
  <h1>ATEM PTZ Bridge</h1>
  <span class="badge" id="wsBadge">サーバー未接続</span>
  <span class="badge" id="atemBadge">ATEM未接続</span>
  <span class="badge" id="padBadge">パッド未検出</span>
  <span class="badge" id="tallyBadge">TALLY</span>
  <span class="kv" id="angles" style="margin-left:auto"></span>
</header>

<nav id="camTabs"></nav>

<main>
  <section class="card">
    <h2 id="gimbalTitle">ジンバル</h2>
    <div id="stickArea"><div id="knob"></div></div>
    <div class="row">
      <label>最大速度</label>
      <input type="range" id="speedScale" min="10" max="100" value="60">
      <span class="kv" id="speedVal">60%</span>
    </div>
    <div class="row">
      <button id="recenterBtn">⌂ センターへ</button>
      <span class="hint">ゲームパッド: 左スティック=パン/チルト、右スティック上下=ズーム、R1押しながらで高速</span>
    </div>
  </section>

  <aside>
    <section class="card" style="margin-bottom:14px">
      <h2>プリセット（タップ=呼び出し / 長押し=保存）</h2>
      <div class="presets" id="presets"></div>
    </section>

    <section class="card">
      <h2 id="camTitle">FX3</h2>
      <div class="row"><label>アイリス</label>
        <input type="range" id="iris" min="0" max="100" value="50">
        <span class="kv" id="irisVal"></span></div>
      <div class="row"><label>ISO</label>
        <select id="iso"></select></div>
      <div class="row"><label>シャッター</label>
        <select id="shutter"></select></div>
      <div class="row"><label>WB</label>
        <input type="range" id="wb" min="2500" max="7500" step="100" value="5600">
        <span class="kv" id="wbVal">5600K</span></div>
      <div class="row"><label>ズーム</label>
        <button data-zoom="-1">W ◀</button>
        <button data-zoom="1">▶ T</button>
        <span class="hint">押している間ズーム（PZレンズのみ）</span></div>
      <div class="row">
        <button class="rec" id="recBtn" style="flex:1">● REC</button>
        <button id="recAllBtn">全カメラREC</button>
      </div>
    </section>
  </aside>
</main>
<div id="toast"></div>

<script>
let CAM = 1;                 // 操作対象カメラ（タブで切り替え）
let camIds = [1];            // サーバー設定から検出したカメラ一覧
let lastTally = {};
let ws = null, recOn = false, savedPresets = [];

let tabsSig = "";
function renderTabs() {
  const sig = JSON.stringify([camIds, CAM, camIds.map(id => lastTally[id] || "off")]);
  if (sig === tabsSig) return;   // 変化がなければDOM再生成しない
  tabsSig = sig;
  const nav = document.getElementById("camTabs");
  nav.innerHTML = "";
  camIds.forEach(id => {
    const b = document.createElement("button");
    const t = lastTally[id] || "off";
    b.className = (id === CAM ? "active " : "") + (t !== "off" ? t : "");
    b.innerHTML = `<span class="dot"></span>CAM ${id}`;
    b.onclick = () => selectCam(id);
    nav.appendChild(b);
  });
  document.getElementById("gimbalTitle").textContent = `ジンバル（カメラ${CAM} / Ronin）`;
  document.getElementById("camTitle").textContent = `FX3 カメラ${CAM}`;
}

function selectCam(id) {
  if (id === CAM) return;
  // 切り替え前に現カメラのジンバルを停止
  send({ t: "joy", cam: CAM, yaw: 0, pitch: 0 });
  CAM = id;
  savedPresets = [];
  renderTabs();
  renderPresets();
}

// ---------- WebSocket ----------
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => setBadge("wsBadge", "サーバー接続", true);
  ws.onclose = () => { setBadge("wsBadge", "サーバー未接続", false); setTimeout(connect, 1500); };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.t === "state") applyState(m);
    if (m.t === "tally") applyTally(m.tally);
    if (m.t === "toast") toast(m.msg);
  };
}
function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }
function setBadge(id, text, on) {
  const el = document.getElementById(id);
  el.textContent = text; el.classList.toggle("on", !!on);
}
function applyState(m) {
  setBadge("atemBadge", m.atem_connected ? "ATEM接続" : "ATEM未接続", m.atem_connected);
  // カメラ一覧の検出（ジンバル設定とカメラ設定の和集合）
  const ids = [...new Set([...Object.keys(m.gimbals || {}), ...Object.keys(m.cameras || {})])]
    .map(Number).sort((a, b) => a - b);
  if (ids.length && JSON.stringify(ids) !== JSON.stringify(camIds)) {
    camIds = ids;
    if (!camIds.includes(CAM)) CAM = camIds[0];
    renderTabs();
  }
  applyTally(m.tally || {});
  const g = (m.gimbals || {})[CAM];
  if (g) {
    savedPresets = g.presets || [];
    renderPresets();
    if (g.angles) {
      document.getElementById("angles").textContent =
        `PAN ${(g.angles.y/10).toFixed(1)}°  TILT ${(g.angles.p/10).toFixed(1)}°`;
    }
  }
  const cam = (m.cameras || {})[CAM];
  if (cam && cam.rec !== recOn) { recOn = cam.rec; renderRec(); }
}
function applyTally(tally) {
  lastTally = tally;
  const t = tally[CAM] || "off";
  const el = document.getElementById("tallyBadge");
  el.className = "badge " + (t !== "off" ? t : "");
  el.textContent = t === "pgm" ? "ON AIR" : t === "pvw" ? "PVW" : "TALLY";
  renderTabs();  // タブのタリー色も更新
}
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.style.opacity = 1;
  setTimeout(() => el.style.opacity = 0, 1800);
}

// ---------- ジョイスティック（画面） ----------
const area = document.getElementById("stickArea");
const knob = document.getElementById("knob");
let dragging = false;
let joy = { x: 0, y: 0 };

function setKnob(x, y) {  // x,y: -1..1
  knob.style.left = `${50 + x * 40}%`;
  knob.style.top = `${50 + y * 40}%`;
}
function pointerJoy(e) {
  const r = area.getBoundingClientRect();
  let x = ((e.clientX - r.left) / r.width - 0.5) * 2.5;
  let y = ((e.clientY - r.top) / r.height - 0.5) * 2.5;
  const len = Math.hypot(x, y);
  if (len > 1) { x /= len; y /= len; }
  joy = { x, y };
  setKnob(x, y);
}
area.addEventListener("pointerdown", e => { dragging = true; area.setPointerCapture(e.pointerId); pointerJoy(e); });
area.addEventListener("pointermove", e => dragging && pointerJoy(e));
["pointerup", "pointercancel"].forEach(ev =>
  area.addEventListener(ev, () => { dragging = false; joy = { x: 0, y: 0 }; setKnob(0, 0); }));

// ---------- ゲームパッド ----------
let padIndex = null;
window.addEventListener("gamepadconnected", e => {
  padIndex = e.gamepad.index;
  setBadge("padBadge", `🎮 ${e.gamepad.id.slice(0, 18)}`, true);
});
window.addEventListener("gamepaddisconnected", () => { padIndex = null; setBadge("padBadge", "パッド未検出", false); });

function readPad() {
  if (padIndex === null) return null;
  const gp = navigator.getGamepads()[padIndex];
  if (!gp) return null;
  const dz = v => Math.abs(v) < 0.08 ? 0 : v;   // デッドゾーン
  const boost = gp.buttons[5] && gp.buttons[5].pressed ? 1.0 : 0.5; // R1=高速
  return {
    x: dz(gp.axes[0]) * boost,
    y: dz(gp.axes[1]) * boost,
    zoom: -dz(gp.axes[3] || 0),   // 右スティック縦: 上=T(寄り) / 下=W(引き)
  };
}

// ---------- 送信ループ (30Hz) ----------
let lastSent = { x: 0, y: 0 };
let lastZoom = 0;
setInterval(() => {
  const pad = readPad();
  const src = (pad && (pad.x || pad.y)) ? pad : joy;
  const scale = document.getElementById("speedScale").value / 100;
  const out = { x: src.x * scale, y: src.y * scale };
  if (out.x || out.y || lastSent.x || lastSent.y) {
    // チルトは上方向を＋にするためYを反転
    send({ t: "joy", cam: CAM, yaw: out.x, pitch: -out.y });
    if (pad && (pad.x || pad.y)) setKnob(pad.x, pad.y);
    lastSent = out;
  }
  // 右スティック → FX3ズーム速度（値が変わったときだけ送信）
  const z = pad ? Math.round(pad.zoom * 10) / 10 : 0;
  if (z !== lastZoom) {
    send({ t: "cam_set", cam: CAM, param: "zoom_speed", value: z });
    lastZoom = z;
  }
}, 33);

document.getElementById("speedScale").oninput = e =>
  document.getElementById("speedVal").textContent = e.target.value + "%";
document.getElementById("recenterBtn").onclick = () => send({ t: "recenter", cam: CAM });

// ---------- プリセット ----------
function renderPresets() {
  const box = document.getElementById("presets");
  if (box.childElementCount === 0) {
    for (let i = 1; i <= 6; i++) {
      const b = document.createElement("button");
      b.textContent = i;
      let timer = null, longPressed = false;
      b.addEventListener("pointerdown", () => {
        longPressed = false;
        timer = setTimeout(() => { longPressed = true; send({ t: "preset_save", cam: CAM, slot: i }); }, 700);
      });
      b.addEventListener("pointerup", () => {
        clearTimeout(timer);
        if (!longPressed) send({ t: "preset_recall", cam: CAM, slot: i });
      });
      b.addEventListener("pointerleave", () => clearTimeout(timer));
      box.appendChild(b);
    }
  }
  [...box.children].forEach((b, i) =>
    b.classList.toggle("saved", savedPresets.includes(String(i + 1))));
}
renderPresets();

// ---------- カメラ ----------
const ISO_LIST = [800, 1000, 1250, 1600, 2000, 2500, 3200, 4000, 5000, 6400, 8000, 10000, 12800];
const SHUTTER_LIST = [50, 60, 100, 125, 250, 500, 1000];
const isoSel = document.getElementById("iso");
ISO_LIST.forEach(v => isoSel.add(new Option("ISO " + v, v)));
isoSel.value = 800;
const shSel = document.getElementById("shutter");
SHUTTER_LIST.forEach(v => shSel.add(new Option("1/" + v, v)));
shSel.value = 50;

isoSel.onchange = () => send({ t: "cam_set", cam: CAM, param: "iso", value: +isoSel.value });
shSel.onchange = () => send({ t: "cam_set", cam: CAM, param: "shutter", value: +shSel.value });

const iris = document.getElementById("iris");
iris.oninput = () => {
  const norm = iris.value / 100;
  document.getElementById("irisVal").textContent = normToF(norm);
  send({ t: "cam_set", cam: CAM, param: "iris_norm", value: norm });
};
function normToF(n) {  // 表示用の目安 (f/1.4〜f/16)
  return "f/" + (1.4 * Math.pow(2, n * 3.5)).toFixed(1);
}
document.getElementById("irisVal").textContent = normToF(0.5);

const wb = document.getElementById("wb");
wb.oninput = () => {
  document.getElementById("wbVal").textContent = wb.value + "K";
  send({ t: "cam_set", cam: CAM, param: "wb_kelvin", value: +wb.value });
};

document.querySelectorAll("[data-zoom]").forEach(b => {
  const dir = +b.dataset.zoom;
  b.addEventListener("pointerdown", () => send({ t: "cam_set", cam: CAM, param: "zoom_speed", value: dir }));
  ["pointerup", "pointerleave"].forEach(ev =>
    b.addEventListener(ev, () => send({ t: "cam_set", cam: CAM, param: "zoom_speed", value: 0 })));
});

const recBtn = document.getElementById("recBtn");
function renderRec() {
  recBtn.classList.toggle("on", recOn);
  recBtn.textContent = recOn ? "■ REC停止" : "● REC";
}
recBtn.onclick = () => { recOn = !recOn; renderRec(); send({ t: "rec", cam: CAM, on: recOn }); };

let allRecOn = false;
document.getElementById("recAllBtn").onclick = () => {
  allRecOn = !allRecOn;
  send({ t: "rec_all", on: allRecOn });
  toast(allRecOn ? "全カメラ REC開始" : "全カメラ REC停止");
};

// 数字キー1〜9でカメラ切り替え、10台目以降はタブクリックで
// （select等にフォーカス中は無効）
document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 9 && camIds.includes(n)) selectCam(n);
});

renderTabs();
connect();
</script>
</body>
</html>
