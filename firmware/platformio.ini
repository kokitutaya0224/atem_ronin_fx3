; ビルド環境を2つ用意:
;   esp32-poe … 有線LAN+PoE版（Olimex ESP32-POE、本番推奨。WiFi不使用）
;   esp32dev … WiFi版（汎用ESP32ボード、検証・予備用）
; 書き込み: pio run -e esp32-poe -t upload

[env:esp32-poe]
platform = espressif32
board = esp32-poe
framework = arduino
monitor_speed = 115200
build_flags = -DNET_ETH
lib_deps =
    bblanchon/ArduinoJson@^7.0

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DNET_WIFI
lib_deps =
    bblanchon/ArduinoJson@^7.0
